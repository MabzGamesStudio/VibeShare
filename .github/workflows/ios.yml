name: iOS app

# Builds the iOS app (mobile/: the web client in a Capacitor shell) on macOS:
#  - a simulator build, started once in the iOS simulator as a smoke test (screenshot kept);
#  - an unsigned .ipa, for tools that sign apps themselves (AltStore, Sideloadly, …);
#  - with App Store Connect secrets, a signed build — uploaded to TestFlight when the
#    workflow is run by hand with "Upload to TestFlight" ticked. See mobile/README.md.
on:
  push:
    paths: ['mobile/**', 'gui/**', 'src/**', 'distribution/**', '.github/workflows/ios.yml']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload the signed build to TestFlight
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: io.github.mabzgamesstudio.vibeshare
  PROJECT: mobile/ios/App/App.xcodeproj

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json
            mobile/package-lock.json
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Web client and native project
        run: |
          # xcodebuild's output, kept short unless something fails
          cat > "$RUNNER_TEMP/quiet.sh" <<'SH'
          #!/bin/bash
          log="$RUNNER_TEMP/xcodebuild-$$.log"
          if xcodebuild "$@" > "$log" 2>&1; then tail -n 3 "$log"; else
            grep -E 'error:|fatal error' "$log" | head -n 60; tail -n 40 "$log"; exit 1; fi
          SH
          chmod +x "$RUNNER_TEMP/quiet.sh"
          npm ci && npm --prefix gui ci && npm --prefix mobile ci
          npm run build:web
          cd mobile && npx cap sync ios

      - name: Simulator build
        run: |
          "$RUNNER_TEMP/quiet.sh" -project "$PROJECT" -scheme App -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/sim" \
            CODE_SIGNING_ALLOWED=NO build
          test -d "$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
      - name: Start it in the simulator
        run: |
          APP="$RUNNER_TEMP/sim/Build/Products/Debug-iphonesimulator/App.app"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, list_ in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE_ID"
          sleep 25
          xcrun simctl io "$DEVICE" screenshot "$RUNNER_TEMP/screenshot.png"
          echo "--- what the app logged (⚡️ lines are the web client's console)"
          xcrun simctl spawn "$DEVICE" log show --last 2m --style compact --predicate 'process == "App"' | grep -E '⚡️|error|Error' | tail -n 60 || true
          if ! xcrun simctl spawn "$DEVICE" launchctl list | grep -q "$BUNDLE_ID"; then
            echo "::error::The app is not running any more"
            exit 1
          fi
          mkdir -p out
          cp "$RUNNER_TEMP/screenshot.png" out/simulator-screenshot.png
          (cd "$(dirname "$APP")" && zip -qry "$GITHUB_WORKSPACE/out/VibeShare-simulator.app.zip" App.app)

      - name: Screenshot as text (temporary, for reviewing this branch)
        if: startsWith(github.ref, 'refs/heads/claude/')
        run: |
          sips -s format jpeg -s formatOptions 55 -Z 760 out/simulator-screenshot.png --out "$RUNNER_TEMP/small.jpg" > /dev/null
          echo "----- BEGIN SCREENSHOT"
          base64 -b 160 -i "$RUNNER_TEMP/small.jpg"
          echo "----- END SCREENSHOT"

      - name: Unsigned .ipa
        run: |
          "$RUNNER_TEMP/quiet.sh" -project "$PROJECT" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$RUNNER_TEMP/Unsigned.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/out/VibeShare-unsigned.ipa" Payload)

      - name: Signed build (with App Store Connect secrets)
        env:
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          UPLOAD: ${{ github.event_name == 'workflow_dispatch' && inputs.testflight }}
        run: |
          if [ -z "$ASC_KEY" ] || [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$TEAM_ID" ]; then
            echo "No App Store Connect secrets: skipping the signed build."
            exit 0
          fi
          printf '%s' "$ASC_KEY" > "$RUNNER_TEMP/AuthKey.p8"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # Xcode signs with certificates and profiles it manages in the cloud for this team.
          "$RUNNER_TEMP/quiet.sh" -project "$PROJECT" -scheme App -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" "${AUTH[@]}" archive
          DESTINATION=export
          [ "$UPLOAD" = "true" ] && DESTINATION=upload
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DESTINATION</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${AUTH[@]}"
          if [ "$DESTINATION" = "export" ]; then cp "$RUNNER_TEMP"/export/*.ipa out/VibeShare.ipa; fi
          rm -f "$RUNNER_TEMP/AuthKey.p8"

      - uses: actions/upload-artifact@v4
        with:
          name: vibeshare-ios
          path: out/
