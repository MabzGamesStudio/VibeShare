name: Release

# Push a tag like v0.1.0 to build and publish every download:
#   standalone binaries (all node types) for Linux, macOS and Windows,
#   the desktop client app for each OS, and the Docker image.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            label: linux + windows
            targets: linux-x64,linux-arm64,linux-ia32,linux-armv7l,windows-x64
          - os: macos-latest
            label: macos
            targets: darwin-x64,darwin-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json
      - uses: oven-sh/setup-bun@v2
      - run: npm ci && npm --prefix gui ci
      - run: npm run binaries -- --targets ${{ matrix.targets }}
      - name: Ad-hoc sign macOS binaries
        if: runner.os == 'macOS'
        run: for f in release/vibeshare-*-macos-*; do codesign --force --sign - "$f"; done
      - name: Rename checksum file per runner
        run: mv release/SHA256SUMS-*.txt "release/SHA256SUMS-${{ runner.os }}.txt"
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ runner.os }}
          path: release/*

  desktop:
    name: Desktop app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            gui/package-lock.json
            desktop/package-lock.json
      - run: npm ci && npm --prefix gui ci && npm --prefix desktop ci
      - run: npm run build
      - name: Package
        working-directory: desktop
        run: npm run prepare-app && npx electron-builder ${{ matrix.target }} --publish never
        env:
          # Unsigned builds unless signing secrets are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
            desktop/release/*.tar.gz

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/vibeshare
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}

  publish:
    name: GitHub release
    needs: [binaries, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
